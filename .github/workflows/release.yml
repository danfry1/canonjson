# Publishes to npm via OIDC trusted publishing, with provenance.
#
# Requires a trusted publisher configured at
# https://www.npmjs.com/package/canonjson/access — repository danfry1/canonjson,
# workflow release.yml, environment npm. npm cannot do this for a package's very
# first version, so 0.1.0 was published from a workstation; every later release
# goes through here.
#
# Publishes under the `next` dist-tag; promote after soaking:
#   npm dist-tag add canonjson@<version> latest
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; pin rather than trust the bundled version.
      - run: npm install -g npm@12.0.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Verify the package resolves correctly for every consumer
        run: |
          npx --yes publint@0.3.23 --strict
          npx --yes @arethetypeswrong/cli@0.18.5 --pack .
      - name: Skip if this version is already on the registry
        id: published
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "canonjson@$version" version --json > /dev/null 2>&1; then
            echo "canonjson@$version is already published; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.skip == 'false'
        run: npm publish --provenance --access public --tag next
