name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14

jobs:
  check:
    name: Format, lint, types, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # The Node the release runs on, so coverage below runs as it does there.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run typecheck
      # The release enforces the coverage thresholds; check them on every PR too.
      - name: Tests with coverage thresholds
        run: bun run test:coverage
      - run: bun run build
      # The build tool needs a recent Node; consumers do not. Build once here and
      # exercise the artifact on every supported runtime below.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 1

  # Separate from `check` so a new advisory (or a registry outage) is reported on
  # its own instead of skipping every other job.
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high

  test:
    name: Tests on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - run: node --version
      - name: Unit tests
        run: node_modules/.bin/vitest run
      - name: Built ESM entry
        run: |
          node --input-type=module --eval '
            const { canonicalize, hash } = await import("./dist/index.js");
            const { hashSync } = await import("./dist/node.js");
            const canonical = canonicalize({ b: 1, a: 2 });
            const digest = await hash({ b: 1, a: 2 });
            if (canonical !== String.raw`{"a":2,"b":1}`) throw new Error(canonical);
            if (digest !== hashSync({ b: 1, a: 2 })) throw new Error("hash mismatch");
          '
      - name: Built CommonJS entry
        run: |
          node --eval '
            const { canonicalize } = require("./dist/index.cjs");
            const canonical = canonicalize({ b: 1, a: 2 });
            if (canonical !== String.raw`{"a":2,"b":1}`) throw new Error(canonical);
          '
      - name: CLI
        run: echo '{"b":1,"a":[2]}' | node bin/canonjson.js --hash

  bun-runtime:
    name: Tests on Bun
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Smoke-test the built package on the Bun runtime
        run: |
          bun --eval '
            const { canonicalize, hash } = await import("./dist/index.js");
            const canonical = canonicalize({ b: 1, a: 2 });
            const digest = await hash({ b: 1, a: 2 });
            if (canonical !== String.raw`{"a":2,"b":1}` || digest.length !== 64) {
              throw new Error(`unexpected output: ${canonical} ${digest}`);
            }
          '
