name: Release

on:
  push:
    tags:
      - "v*"

permissions: read-all

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.repository == 'danfry1/canonjson'

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Put the lockfile-pinned npm (a devDependency, integrity-checked by bun
      # install) ahead of the runner's bundled npm for the rest of the job.
      - name: Use repo-pinned npm
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Format
        run: bun run fmt:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Lint the published package
        run: bunx publint@0.3.23 --strict

      - name: Check package exports
        run: |
          npm pack --ignore-scripts --pack-destination /tmp
          bunx @arethetypeswrong/cli@0.18.5 /tmp/canonjson-*.tgz

      # Bootstrapping a package means publishing its first version by hand, so a
      # tag can point at a version that is already live. Skip rather than fail.
      - name: Check whether this version is already published
        id: published
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "canonjson@$version" version > /dev/null 2>&1; then
            echo "canonjson@$version is already on the registry; skipping the publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage publish to npm
        if: steps.published.outputs.skip == 'false' 
        # Uploads the tarball to npm's stage queue. Provenance is auto-generated
        # via OIDC trusted publishing. The version is NOT installable until a
        # maintainer approves it with a 2FA challenge:
        #   npm stage approve <id>   (or approve on npmjs.com)
        run: npm stage publish

      - name: Staged-publish approval reminder
        if: steps.published.outputs.skip == 'false'
        run: echo "::notice::Version staged to npm. Approve it (npm stage approve <id>, or on npmjs.com) with 2FA to make it installable."

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" --generate-notes
